# The test company (docs/plans/phase3.md): stand-ins for a small retailer's ten services.
# Slice 1: the two kept services (payments, accounting) and the automation glue (n8n).
# Every port is bound to 127.0.0.1: nothing here is reachable from outside this machine.
# The tools publish no ports: everything reaches them through `observe`, the recording proxy,
# so all their traffic is recorded (recordings/<tool>.jsonl; observe/record.py).
name: testco

services:
  # Kept service 1: payments. Stripe's own mock of its API (no real money, no account needed).
  payments:
    image: stripe/stripe-mock:v0.197.0

  # Kept service 2: accounting and tax filing. Odoo with the Invoicing/Accounting app.
  accounting-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes: [accounting-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 3s
      retries: 30

  accounting:
    image: odoo:18.0
    depends_on:
      accounting-db: {condition: service_healthy}
    environment:
      HOST: accounting-db
      USER: odoo
      PASSWORD: odoo
    # A database named testco with the accounting app, created on first start; no demo data.
    command: ["odoo", "-d", "testco", "-i", "account", "--without-demo=all", "--db-filter=^testco$"]
    volumes: [accounting-data:/var/lib/odoo]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8069/web/health || exit 1"]
      interval: 5s
      retries: 60
      start_period: 30s

  # Replaced in stage 1: the automation glue (Zapier's role).
  automation:
    image: n8nio/n8n:1.80.0
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    volumes: [automation-data:/home/node/.n8n]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]  # localhost is ::1 here; n8n listens on IPv4
      interval: 5s
      retries: 30

  # Replaced in stage 7 (last: staff use it all day): the web shop (Shopify's role).
  shop-db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes: [shop-db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  shop:
    image: wordpress:6.7-php8.3-apache
    depends_on:
      shop-db: {condition: service_healthy}
    environment: &shop-env
      WORDPRESS_DB_HOST: shop-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      # API passwords over plain HTTP are allowed only on a "local" site; this one is.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_HOME', 'http://127.0.0.1:8080');
        define('WP_SITEURL', 'http://127.0.0.1:8080');
    volumes: [shop-html:/var/www/html]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1/wp-includes/images/w-logo-blue.png || exit 1"]
      interval: 3s
      retries: 40

  shop-setup:  # one-off: installs WooCommerce and the API credential (shop/setup.sh), then exits
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      shop: {condition: service_healthy}
    environment: *shop-env
    volumes: [shop-html:/var/www/html, ./shop/setup.sh:/setup.sh:ro]
    command: ["sh", "/setup.sh"]
    restart: "no"

  # The company's own code (the glue Optum analyses and, in stage 1, replaces): its Python
  # scripts, and its payments webhook (Node). Both call the tools by their internal names.
  company:
    build: ./company
    user: "1000:1000"  # writes into ./data, which the host also writes
    volumes: ["./company:/company:ro", "./driver:/driver:ro", "./data:/data"]

  # The business driver (driver/business_day.py): stands in for customers and Stripe, in its own
  # container so its traffic is recorded as theirs, not the company's.
  driver:
    build: ./company
    user: "1000:1000"  # writes into ./data, which the host also writes
    volumes: ["./company:/company:ro", "./driver:/driver:ro", "./data:/data"]

  # The owned system (stage 1): replaces the automation glue. Built by Optum, owned by the company.
  owned:
    build: ./company
    user: "1000:1000"  # writes into ./data, which the host also writes
    command: ["python", "/owned/orders_service.py"]
    environment:
      MODE: shadow
    volumes: ["./company:/company:ro", "./owned:/owned:ro", "./data:/data"]

  hooks:
    image: node:22-alpine
    command: ["node", "/company/payments_webhook.js"]
    volumes: ["./company:/company:ro"]

  # The recording proxy (docs/plans/phase3.md, feat/observe): mitmproxy in reverse mode, one port
  # per tool, recording every exchange with secrets redacted.
  observe:
    image: mitmproxy/mitmproxy:11.1.3
    depends_on: [payments, accounting, automation, shop, hooks, owned]
    # The tools' internal names all lead here (each on its own port), so every call is recorded.
    networks:
      default:
        aliases: [payments.testco.internal, accounting.testco.internal, automation.testco.internal,
                  shop.testco.internal, hooks.testco.internal, marketing.testco.internal,
                  owned.testco.internal]
    command: >-
      mitmdump --set block_global=false --set connection_strategy=lazy --set keep_host_header=true
      --mode reverse:http://payments:12111@12111
      --mode reverse:http://accounting:8069@8069
      --mode reverse:http://automation:5678@5678
      --mode reverse:http://shop:80@8080
      --mode reverse:http://hooks:3000@3000
      --mode reverse:http://owned:7000@7000
      -s /observe/addon.py
    environment:
      RECORDINGS_DIR: /recordings
    ports: ["127.0.0.1:12111:12111", "127.0.0.1:8069:8069", "127.0.0.1:5678:5678", "127.0.0.1:8080:8080", "127.0.0.1:3000:3000", "127.0.0.1:7000:7000"]
    volumes: ["./observe:/observe:ro", "./recordings:/recordings"]

volumes:
  shop-db:
  shop-html:
  accounting-db:
  accounting-data:
  automation-data:
