name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes an older run pointless: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema test tools
        run: pip install jsonschema
      - name: Install Graphviz and C library headers (SVG export and C sample tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q graphviz libcurl4-openssl-dev libsqlite3-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j 4
      - name: Test
        # Tests in parallel on the runner's 4 cores (the sanitizer build was ~25 min run one by one).
        run: ctest --preset ${{ matrix.preset }} -j 4 --output-on-failure
