# Pull requests from collaborators need the owner's approval on their latest commit before merging
# (docs/CONTRIBUTING.md, "Working together"). The free plan can't block the merge button for a
# private repo, so this check makes the rule visible: red until approved, red again after new
# commits. PRs opened by the owner pass at once.
name: Owner approval
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

jobs:
  owner-approval:
    runs-on: ubuntu-24.04
    steps:
      - name: Check for the owner's approval
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: Scramblehub
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$AUTHOR" = "$OWNER" ]; then
            echo "Opened by $OWNER: no approval needed."
            exit 0
          fi
          latest=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.user.login == \"$OWNER\" and .state != \"COMMENTED\")] | last | \"\(.state // \"NONE\") \(.commit_id // \"\")\"")
          state=${latest%% *}
          commit=${latest#* }
          if [ "$state" = "APPROVED" ] && [ "$commit" = "$HEAD" ]; then
            echo "Approved by $OWNER on the latest commit."
            exit 0
          fi
          if [ "$state" = "APPROVED" ]; then
            echo "::error::$OWNER approved an earlier commit; the PR has changed since. Ask for another review."
          else
            echo "::error::Pull requests from collaborators need an approving review from $OWNER on the latest commit before merging (docs/CONTRIBUTING.md). Current: $state."
          fi
          exit 1
